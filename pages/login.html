<section class="login">
    <div class="login__card">

        <img src="assets/logo.png" alt="Mi Cooperadora" class="login__logo">

        <h1>Mi Cooperadora</h1>
        <p>Ingresá para continuar</p>

        <form id="loginForm">

            <label for="loginEmail">Correo electrónico</label>
            <input
                type="email"
                id="loginEmail"
                required
                autocomplete="email"
            >

            <label for="loginPassword">Contraseña</label>
            <input
                type="password"
                id="loginPassword"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Ingresar
            </button>

        </form>

        <p id="loginError"></p>

    </div>
</section>
